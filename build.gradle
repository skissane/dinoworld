plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example'

base {
    archivesName = 'dinoworld'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${project.property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand version: version
    }
}

jar {
    from('LICENSE') {
        rename { 'LICENSE-dinoworld' }
    }
}

// Modrinth-format modpack (.mrpack) for installing the mod on another machine,
// e.g. via Prism Launcher's "Import from zip" (which also accepts a URL).
// Both jars go in overrides/ so the pack is self-contained and needs no CDN hashes.
configurations {
    modpackMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    modpackMods "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"
}

def generateModpackIndex = tasks.register('generateModpackIndex') {
    def packVersion = project.version.toString()
    def minecraftVersion = project.property('minecraft_version').toString()
    def loaderVersion = project.property('loader_version').toString()
    def indexFile = layout.buildDirectory.file('modpack/modrinth.index.json')
    inputs.property 'packVersion', packVersion
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'loaderVersion', loaderVersion
    outputs.file indexFile
    doLast {
        def index = [
            formatVersion: 1,
            game         : 'minecraft',
            versionId    : packVersion,
            name         : 'DinoWorld',
            files        : [],
            dependencies : [
                minecraft      : minecraftVersion,
                'fabric-loader': loaderVersion,
            ],
        ]
        indexFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(index))
    }
}

tasks.register('modpack', Zip) {
    group = 'distribution'
    description = 'Builds a .mrpack containing DinoWorld and Fabric API.'
    archiveFileName = "dinoworld-${project.version}.mrpack"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from generateModpackIndex
    into('overrides/mods') {
        from tasks.named('jar')
        from configurations.modpackMods
    }
}
