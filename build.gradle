plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// The version comes from the latest v* git tag: tagging v1.2.0 builds 1.2.0, and
// later commits build e.g. 1.2.0-3-gabc1234 (3 commits past the tag), with -dirty
// added for uncommitted changes. Outside a git checkout or without a v* tag, it's
// 0.0.0-SNAPSHOT (git itself must be installed).
def gitDescribe = providers.exec {
    commandLine 'git', 'describe', '--tags', '--match', 'v*', '--dirty'
    ignoreExitValue = true
}
version = gitDescribe.result.get().exitValue == 0
        ? gitDescribe.standardOutput.asText.get().trim().substring(1)
        : '0.0.0-SNAPSHOT'
group = 'com.example'

base {
    archivesName = 'dinoworld'
}

def fabricApi = "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${project.property('loader_version')}"
    implementation fabricApi
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand version: version
    }
}

jar {
    from('LICENSE') {
        rename { 'LICENSE-dinoworld' }
    }
}

// Modrinth-format modpack (.mrpack) for installing the mod on another machine,
// e.g. via Prism Launcher's "Import from zip" (which also accepts a URL).
// Both jars go in overrides/ so the pack is self-contained and needs no CDN hashes.
// Only the mod jar (with its include'd jars nested inside) and modpackMods are packed:
// a new runtime mod added via implementation must also be added to modpackMods.
configurations {
    modpackMods {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    modpackMods fabricApi
}

def generateModpackIndex = tasks.register('generateModpackIndex') {
    def packVersion = project.version.toString()
    def minecraftVersion = project.property('minecraft_version').toString()
    def loaderVersion = project.property('loader_version').toString()
    def indexFile = layout.buildDirectory.file('modpack/modrinth.index.json')
    inputs.property 'packVersion', packVersion
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'loaderVersion', loaderVersion
    outputs.file indexFile
    doLast {
        def index = [
            formatVersion: 1,
            game         : 'minecraft',
            versionId    : packVersion,
            name         : 'DinoWorld',
            files        : [],
            dependencies : [
                minecraft      : minecraftVersion,
                'fabric-loader': loaderVersion,
            ],
        ]
        indexFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(index))
    }
}

tasks.register('modpack', Zip) {
    group = 'distribution'
    description = 'Builds a .mrpack containing DinoWorld and Fabric API.'
    archiveFileName = "dinoworld-${project.version}.mrpack"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from generateModpackIndex
    into('overrides/mods') {
        from tasks.named('jar')
        from configurations.modpackMods
    }
}

// Files for a GitHub Release that packwiz-installer can update from, using
// https://github.com/<owner>/<repo>/releases/latest/download/pack.toml.
// Release assets are a flat list, so index.toml lists the jars directly
// (no .pw.toml metafiles) and uses `alias` to install them into mods/.
tasks.register('packwizRelease') {
    group = 'distribution'
    description = 'Builds pack.toml, index.toml and jars for a packwiz-updatable GitHub Release.'
    def modJar = tasks.named('jar').flatMap { it.archiveFile }
    def bundledMods = configurations.modpackMods
    def packVersion = project.version.toString()
    def minecraftVersion = project.property('minecraft_version').toString()
    def loaderVersion = project.property('loader_version').toString()
    def outDir = layout.buildDirectory.dir('packwiz-release')
    inputs.files modJar, bundledMods
    inputs.property 'packVersion', packVersion
    inputs.property 'minecraftVersion', minecraftVersion
    inputs.property 'loaderVersion', loaderVersion
    outputs.dir outDir
    doLast {
        def dir = outDir.get().asFile
        dir.deleteDir()
        dir.mkdirs()
        def sha256 = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }

        def index = new StringBuilder('hash-format = "sha256"\n')
        def names = [] as Set
        ([modJar.get().asFile] + bundledMods.files.toList()).each { File jar ->
            // GitHub rewrites unusual characters in asset names (e.g. the '+' in Fabric API's version)
            def name = jar.name.replaceAll(/[^A-Za-z0-9._-]/, '-')
            if (!names.add(name)) {
                throw new GradleException("Two jars would both be released as ${name}")
            }
            def copy = new File(dir, name)
            copy.bytes = jar.bytes
            index << "\n[[files]]\nfile = \"${name}\"\nalias = \"mods/${name}\"\nhash = \"${sha256(copy)}\"\n"
        }
        def indexFile = new File(dir, 'index.toml')
        indexFile.text = index.toString()

        new File(dir, 'pack.toml').text = """\
            name = "DinoWorld"
            version = "${packVersion}"
            pack-format = "packwiz:1.1.0"

            [index]
            file = "index.toml"
            hash-format = "sha256"
            hash = "${sha256(indexFile)}"

            [versions]
            minecraft = "${minecraftVersion}"
            fabric = "${loaderVersion}"
            """.stripIndent()
    }
}
