name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# A newer push to a PR supersedes its older run; runs for main and tags are
# never cancelled, so a release can't be cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history and tags, since build.gradle takes the version from
      # git describe.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle dependencies (incl. Minecraft/Loom downloads) and
      # validates gradle-wrapper.jar against the known Gradle checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A v* tag publishes a release, so fail if Gradle didn't get the tag's
      # version (e.g. it fell back to 0.0.0-SNAPSHOT, or the tree is dirty).
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but Gradle version is $version"
            exit 1
          fi

      - name: Build mod, modpack and packwiz files
        run: ./gradlew build modpack packwizRelease prismInstance

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-jar
          path: |
            build/libs/dinoworld-*.jar
            !build/libs/dinoworld-*-sources.jar
          if-no-files-found: error

      - name: Upload modpack
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-mrpack
          path: build/distributions/dinoworld-*.mrpack
          if-no-files-found: error

      - name: Upload Prism instance
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-prism
          path: build/distributions/dinoworld-prism.zip
          if-no-files-found: error

      # pack.toml, index.toml and the jars they list. This includes a copy of the
      # mod jar identical to dinoworld-jar's, so merging them in the release job
      # is harmless.
      - name: Upload packwiz files
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-packwiz
          path: build/packwiz-release/
          if-no-files-found: error

  # On a v* tag, attach the jar, mrpack, packwiz files and Prism instance zip the build job produced to a new
  # GitHub Release. Only this job gets write access, and it runs no repo code.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
