name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# A newer push to a PR supersedes its older run; runs for main and tags are
# never cancelled, so a release can't be cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history and tags, since build.gradle takes the version from
      # git describe.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle dependencies (incl. Minecraft/Loom downloads) and
      # validates gradle-wrapper.jar against the known Gradle checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod and modpack
        run: ./gradlew build modpack

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-jar
          path: |
            build/libs/dinoworld-*.jar
            !build/libs/dinoworld-*-sources.jar
          if-no-files-found: error

      - name: Upload modpack
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-mrpack
          path: build/distributions/dinoworld-*.mrpack
          if-no-files-found: error

  # On a v* tag, attach the jar and mrpack the build job produced to a new
  # GitHub Release. Only this job gets write access, and it runs no repo code.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
