name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

# A newer push to a PR supersedes its older run; runs for main and tags are
# never cancelled, so a release can't be cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Caches Gradle dependencies (incl. Minecraft/Loom downloads) and
      # validates gradle-wrapper.jar against the known Gradle checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A v* tag publishes a release, so make sure the tag names the version
      # actually built (version is set in build.gradle).
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Build mod and modpack
        run: ./gradlew build modpack

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-jar
          path: |
            build/libs/dinoworld-*.jar
            !build/libs/dinoworld-*-sources.jar
          if-no-files-found: error

      - name: Upload modpack
        uses: actions/upload-artifact@v4
        with:
          name: dinoworld-mrpack
          path: build/distributions/dinoworld-*.mrpack
          if-no-files-found: error

  # On a v* tag, attach the jar and mrpack the build job produced to a new
  # GitHub Release. Only this job gets write access, and it runs no repo code.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
